<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyInviter — Taklifnoma yaratish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#f7f3ed;
  color:#40372f;
  font-family:Georgia,"Times New Roman",serif;
  padding:25px 15px 60px;
}

.container{
  width:100%;
  max-width:620px;
  margin:auto;
}

.header{
  text-align:center;
  padding:25px 0 30px;
}

.logo{
  font-size:36px;
  font-weight:normal;
}

.subtitle{
  margin-top:8px;
  color:#8d7a68;
  font-size:13px;
}

.card{
  background:#fffdf9;
  border:1px solid #e5dbcf;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(70,50,35,.06);
}

.card h2{
  font-size:20px;
  font-weight:normal;
  margin-bottom:20px;
}

label{
  display:block;
  font-size:12px;
  color:#7d6b5a;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:17px;
  border:1px solid #dfd4c7;
  background:#fdfbf8;
  color:#40372f;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:#a99076;
}

.button{
  width:100%;
  padding:15px;
  border:1px solid #9b836c;
  background:#5c4d40;
  color:white;
  font-family:inherit;
  font-size:12px;
  letter-spacing:1px;
  cursor:pointer;
}

.button:disabled{
  opacity:.6;
}

.photos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.photo-option{
  position:relative;
  cursor:pointer;
}

.photo-option input{
  position:absolute;
  opacity:0;
  width:0;
  height:0;
  margin:0;
}

.photo-option img{
  display:block;
  width:100%;
  aspect-ratio:9/12;
  object-fit:cover;
  border:3px solid transparent;
}

.photo-option input:checked + img{
  border-color:#9b836c;
}

.music-option{
  padding:14px;
  margin-bottom:10px;
  background:#fdfbf8;
  border:1px solid #e1d6ca;
}

.music-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.music-row input{
  width:auto;
  margin:0;
}

.music-name{
  flex:1;
  font-size:13px;
}

.play-btn{
  border:1px solid #bda990;
  background:#fffdf9;
  padding:7px 11px;
  cursor:pointer;
}

audio{
  width:100%;
  margin-top:15px;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  line-height:1.6;
}

.success{
  color:#527052;
}

.error{
  color:#9b4b4b;
}

.result{
  display:none;
  text-align:center;
}

.result h2{
  font-size:24px;
  font-weight:normal;
  margin-bottom:12px;
}

.link-box{
  margin:18px 0;
  padding:14px;
  background:#f7f3ed;
  word-break:break-all;
  font-size:13px;
  color:#5c4d40;
}

.copy{
  width:100%;
  padding:13px;
  border:1px solid #9b836c;
  background:#fffdf9;
  color:#5c4d40;
  font-family:inherit;
  cursor:pointer;
}

.small{
  color:#9b836c;
  font-size:11px;
  line-height:1.6;
  margin-top:10px;
}

@media(max-width:500px){

  .card{
    padding:20px;
  }

  .photos{
    gap:8px;
  }

  .logo{
    font-size:31px;
  }
}
</style>
</head>

<body>

<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://bhqdkzeueunfhompvywm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CiiL8jno2aCpj8LQBZmemA_H7vFnnS1";


/* ==============================
   SLUG
============================== */

function generateSlug(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

  let slug = "";

  for(let i=0;i<6;i++){

    slug += chars[
      Math.floor(
        Math.random() *
        chars.length
      )
    ];

  }

  return slug;
}


/* ==============================
   MUSIC PREVIEW
============================== */

function previewMusic(
  button,
  url
){

  const audio =
    document.getElementById(
      "musicPreview"
    );


  if(
    audio.src === url &&
    !audio.paused
  ){

    audio.pause();

    button.innerText =
      "▶️";

    return;

  }


  document
  .querySelectorAll(
    ".play-btn"
  )
  .forEach(
    btn => btn.innerText = "▶️"
  );


  audio.src =
    url;

  audio.load();

  audio.play()
  .then(
    () => {
      button.innerText = "⏸";
    }
  )
  .catch(
    error => console.log(error)
  );

}


/* ==============================
   CREATE INVITATION
============================== */

async function createInvitation(){

  const button =
    document.getElementById(
      "createButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  const groom =
    document
    .getElementById(
      "groomName"
    )
    .value
    .trim();


  const bride =
    document
    .getElementById(
      "brideName"
    )
    .value
    .trim();


  const eventDate =
    document
    .getElementById(
      "eventDate"
    )
    .value;


  const venue =
    document
    .getElementById(
      "venue"
    )
    .value
    .trim();


  const address =
    document
    .getElementById(
      "address"
    )
    .value
    .trim();


  const mapsUrl =
    document
    .getElementById(
      "mapsUrl"
    )
    .value
    .trim();


  const photo =
    document.querySelector(
      'input[name="photoChoice"]:checked'
    );


  const music =
    document.querySelector(
      'input[name="musicChoice"]:checked'
    );


  if(
    !groom ||
    !bride ||
    !eventDate ||
    !venue ||
    !address
  ){

    message.className =
      "message error";

    message.innerText =
      "❌ Majburiy maydonlarni to‘ldiring.";

    return;

  }


  button.disabled =
    true;

  button.innerText =
    "YARATILMOQDA...";

  message.className =
    "message";

  message.innerText =
    "Taklifnoma tayyorlanmoqda...";


  try{

    /*
      Har bir yangi taklifnoma
      uchun yangi slug.
    */

    const slug =
      generateSlug();


    const data = {

      slug:
        slug,

      groom_name:
        groom,

      bride_name:
        bride,

      event_date:
        eventDate,

      venue:
        venue,

      address:
        address,

      maps_url:
        mapsUrl,

      photo_url:
        photo
          ? photo.value
          : "",

      music_url:
        music
          ? music.value
          : ""

    };


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/invitations",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(data)

        }

      );


    const text =
      await response.text();


    console.log(
      "SUPABASE:",
      response.status,
      text
    );


    if(!response.ok){

      let error = {};

      try{

        error =
          JSON.parse(text);

      }catch(e){}


      throw new Error(
        error.message ||
        error.hint ||
        text ||
        "Taklifnoma yaratilmadi"
      );

    }


    let result;

    try{

      result =
        JSON.parse(text);

    }catch(e){

      throw new Error(
        "Supabase javobi noto‘g‘ri."
      );

    }


    if(
      !Array.isArray(result) ||
      result.length === 0
    ){

      throw new Error(
        "Taklifnoma yaratilmadi."
      );

    }


    const invitation =
      result[0];


    const finalSlug =
      invitation.slug ||
      slug;


    /*
      Yangi URL
    */

    const link =
      window.location.origin +
      "/i/" +
      finalSlug;


    document.getElementById(
      "invitationLink"
    ).innerText =
      link;


    document.getElementById(
      "openLink"
    ).href =
      link;


    document.getElementById(
      "result"
    ).style.display =
      "block";


    message.className =
      "message success";


    message.innerText =
      "✅ Taklifnoma muvaffaqiyatli yaratildi!";


    button.innerText =
      "TAKLIFNOMA YARATILDI";


    document.getElementById(
      "result"
    ).scrollIntoView({
      behavior:"smooth"
    });


  }catch(error){

    console.error(error);


    message.className =
      "message error";


    message.innerText =
      "❌ Xatolik: " +
      error.message;


    button.disabled =
      false;


    button.innerText =
      "TAKLIFNOMANI YARATISH";

  }

}


/* ==============================
   COPY
============================== */

async function copyLink(){

  const link =
    document.getElementById(
      "invitationLink"
    ).innerText;


  try{

    await navigator.clipboard.writeText(
      link
    );

    alert(
      "✅ Link nusxalandi!"
    );

  }catch(error){

    prompt(
      "Linkni nusxalang:",
      link
    );

  }

}

</script>
